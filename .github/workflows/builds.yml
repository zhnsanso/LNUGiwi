name: Builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Gradle wrapper and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "未配置签名密钥 secrets，本次构建回退 debug 签名"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/giwifi-release.jks
          cat > android/key.properties <<EOF
          storeFile=giwifi-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android artifact
        uses: actions/upload-artifact@v6
        with:
          name: artifact-android
          path: build/app/outputs/flutter-apk/app-release.apk

  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Package macOS DMG
        run: |
          set -euo pipefail
          app="build/macos/Build/Products/Release/giwifi_ua_switcher.app"
          dmg="build/GiWiFi-macOS-universal.dmg"
          rm -rf build/dmg-root
          mkdir -p build/dmg-root
          cp -R "$app" build/dmg-root/
          ln -s /Applications build/dmg-root/Applications
          hdiutil create -volname "GiWiFi" -srcfolder build/dmg-root -ov -format UDZO "$dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: artifact-macos
          path: build/GiWiFi-macOS-universal.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/GiWiFi-Windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: artifact-windows
          path: build/GiWiFi-Windows-x64.zip

  build-headless:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            platform: linux/arm64
            dart_arch: arm64
          - arch: x86_64
            platform: linux/amd64
            dart_arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      # headless 版是纯 dart:io 代码，容器里只需 Dart SDK；
      # 由于 bin 用 package: 导入，临时生成最小 package_config（无需 flutter pub get）。
      - name: Build in ${{ matrix.arch }} container
        env:
          DART_VERSION: 3.10.9
          DART_ARCH: ${{ matrix.dart_arch }}
        run: |
          docker run --rm \
            --platform ${{ matrix.platform }} \
            -e DART_VERSION -e DART_ARCH \
            -v "$PWD":/src -w /src \
            debian:bookworm-slim bash -c '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends curl ca-certificates unzip
              curl -fsSLo /tmp/dart-sdk.zip \
                "https://storage.googleapis.com/dart-archive/channels/stable/release/${DART_VERSION}/sdk/dartsdk-linux-${DART_ARCH}-release.zip"
              unzip -q /tmp/dart-sdk.zip -d /opt
              mkdir -p .dart_tool build/headless
              printf "%s" "{\"configVersion\":2,\"packages\":[{\"name\":\"giwifi_ua_switcher\",\"rootUri\":\"../\",\"packageUri\":\"lib/\",\"languageVersion\":\"3.5\"}]}" > .dart_tool/package_config.json
              /opt/dart-sdk/bin/dart compile exe bin/giwifi_headless.dart \
                -o build/headless/giwifi-headless
            '

      - name: Package headless tarball
        run: |
          set -euo pipefail
          mkdir -p build/pkg
          cp build/headless/giwifi-headless build/pkg/
          cp deploy/giwifi-headless.service deploy/README-headless.md build/pkg/
          tar -czf "build/GiWiFi-headless-linux-${{ matrix.arch }}.tar.gz" -C build/pkg .

      - name: Upload headless artifact
        uses: actions/upload-artifact@v6
        with:
          name: artifact-headless-${{ matrix.arch }}
          path: build/GiWiFi-headless-linux-${{ matrix.arch }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-macos, build-windows, build-headless]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Name Android APK
        run: mv dist/app-release.apk dist/GiWiFi-Android.apk

      - name: Generate sha256
        run: |
          cd dist/
          sha256sum ./* > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
