name: Builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android artifact
        uses: actions/upload-artifact@v6
        with:
          name: artifact-android
          path: build/app/outputs/flutter-apk/app-release.apk

  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Package macOS ZIP and DMG
        run: |
          set -euo pipefail
          app="build/macos/Build/Products/Release/giwifi_ua_switcher.app"
          zip="build/GiWiFi-macOS-universal.zip"
          dmg="build/GiWiFi-macOS-universal.dmg"
          zip -qry "$zip" "$app"
          rm -rf build/dmg-root
          mkdir -p build/dmg-root
          cp -R "$app" build/dmg-root/
          ln -s /Applications build/dmg-root/Applications
          hdiutil create -volname "GiWiFi" -srcfolder build/dmg-root -ov -format UDZO "$dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: artifact-macos
          path: |
            build/GiWiFi-macOS-universal.zip
            build/GiWiFi-macOS-universal.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/GiWiFi-Windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: artifact-windows
          path: build/GiWiFi-Windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-macos, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Name Android APK
        run: mv dist/app-release.apk dist/GiWiFi-Android.apk

      - name: Generate sha256
        run: |
          cd dist/
          sha256sum ./* > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
